language: python
python:
  - "3.10"
service:
  - docker
install:
  - pip install -r requirements.txt
script:
  - python -m pytest tests/
  
before_deploy:
  - docker build -t cicd_docker_webapp .
  - docker tag cicd_docker_webapp:latest registry.heroku.com/cicd_docker_webapp/web
  - echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

deploy:
    provider:script
    script: 
      docker push registry.heroku.com/cicd_docker_webapp/web && heroku container:release web --app cicd_docker_webapp
      on:
        branch: main